name: adorable-windows-build

# DECISION HARNESS v0.9B — Real Windows Native Build + Acceptance Worker
#
# Runs on public `windows-latest` image.
# Binds source bundle, provenance, toolchain verification, PE validation,
# standalone packaging, launch smoke test, and preview capture into a
# fail-closed NativeAcceptanceReport.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Adorable durable build job id (job_<hex>)"
        required: true
        type: string
      project_id:
        description: "Adorable project id (prj_<hex>)"
        required: true
        type: string
      build_id:
        description: "Opaque build id (build_<hex>)"
        required: true
        type: string
      app_id:
        description: "Stable application id (reverse-DNS)"
        required: true
        type: string
      source_bundle_key:
        description: "R2 key of the validated source bundle"
        required: true
        type: string
      source_bundle_sha256:
        description: "Expected SHA-256 of the source bundle JSON"
        required: true
        type: string
      target_platform:
        description: "Must be windows"
        required: true
        type: string
      target_arch:
        description: "Must be x64"
        required: true
        type: string
      generation_contract_hash:
        description: "Cryptographic hash of NativeGenerationContract (h-<16hex> or 64hex)"
        required: true
        type: string
      quickgui_revision:
        description: "Pinned QuickGUI revision SHA (0a5007a03be4a0ba08c7da27010f74699711255)"
        required: true
        type: string
      callback_url:
        description: "Backend completion callback URL (https)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: adorable-build-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      ADORABLE_JOB_ID: ${{ inputs.job_id }}
      ADORABLE_PROJECT_ID: ${{ inputs.project_id }}
      ADORABLE_APP_ID: ${{ inputs.app_id }}
      ADORABLE_BUILD_ID: ${{ inputs.build_id }}
      ADORABLE_TARGET_PLATFORM: ${{ inputs.target_platform }}
      ADORABLE_TARGET_ARCH: ${{ inputs.target_arch }}
      ADORABLE_GENERATION_CONTRACT_HASH: ${{ inputs.generation_contract_hash }}
      ADORABLE_QUICKGUI_REVISION: ${{ inputs.quickgui_revision }}
      ADORABLE_SOURCE_BUNDLE_KEY: ${{ inputs.source_bundle_key }}
      ADORABLE_SOURCE_BUNDLE_SHA256: ${{ inputs.source_bundle_sha256 }}
      ADORABLE_CALLBACK_URL: ${{ inputs.callback_url }}
      # Secrets enter ONLY via env
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ADORABLE_CALLBACK_SECRET: ${{ secrets.ADORABLE_CALLBACK_SECRET }}
    steps:
      - name: Check out worker mechanics (public, no secrets, no user code)
        uses: actions/checkout@v4

      - name: Set up Bun (pinned deterministic version)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache pinned QuickGUI toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quickgui-pinned
          key: quickgui-source-${{ inputs.quickgui_revision }}

      - name: Stage pinned QuickGUI source repository & build host
        run: bun ./scripts/setup-toolchain.ts

      - name: Fetch + verify source bundle & non-circular hash
        run: bun ./scripts/fetch-bundle.ts

      - name: Install dependencies (no lifecycle scripts)
        run: bun ./scripts/install-deps.ts

      - name: Verify QuickGUI toolchain provenance
        run: bun ./scripts/verify-toolchain.ts

      - name: QuickGUI check
        run: bun ./scripts/run-step.ts check

      - name: QuickGUI build & PE discovery
        run: bun ./scripts/run-step.ts build

      - name: Package standalone executable with final PE validation
        run: bun ./scripts/package.ts

      - name: Security validation (trusted worker scripts, never app code)
        run: bun ./scripts/validate.ts

      - name: Native launch smoke test & preview capture
        run: bun ./scripts/smoke.ts

      - name: Deterministic Windows runtime evidence execution
        run: bun ./scripts/evidence.ts

      - name: Assemble structured acceptance report & hash artifacts
        run: bun ./scripts/generate-acceptance.ts

      - name: Upload artifacts and acceptance report to R2
        run: bun ./scripts/upload.ts

      - name: Report completion to backend (always runs, fail-closed)
        if: always()
        run: bun ./scripts/report.ts

      - name: Clean runner workspace (always)
        if: always()
        run: bun ./scripts/clean.ts
