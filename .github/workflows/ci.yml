name: Worker CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install
      - name: Type check worker scripts
        run: bun run typecheck
      - name: Validate worker scripts integrity & syntax
        run: bun run validate
      - name: Run worker test suite
        run: bun test
